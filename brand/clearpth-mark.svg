<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024" role="img" aria-labelledby="title desc">
  <title id="title">ClearPth Emblem</title>
  <desc id="desc">A polished ClearPth path emblem for profile images and app icons.</desc>
  <defs>
    <radialGradient id="markGlow" cx="50%" cy="42%" r="62%">
      <stop offset="0%" stop-color="#F8EAC1" stop-opacity="0.28" />
      <stop offset="52%" stop-color="#6F876D" stop-opacity="0.12" />
      <stop offset="100%" stop-color="#080807" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="markGold" x1="20%" y1="12%" x2="82%" y2="92%">
      <stop offset="0%" stop-color="#FFF4CE" />
      <stop offset="45%" stop-color="#D6B761" />
      <stop offset="100%" stop-color="#7C6330" />
    </linearGradient>
    <filter id="markShadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="34" stdDeviation="34" flood-color="#000000" flood-opacity="0.5" />
    </filter>
    <filter id="centerGlow" x="-45%" y="-45%" width="190%" height="190%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <rect width="1024" height="1024" rx="228" fill="#080807" />
  <circle cx="512" cy="472" r="430" fill="url(#markGlow)" />

  <g filter="url(#markShadow)">
    <rect x="238" y="222" width="548" height="548" rx="124" fill="#10100E" stroke="#2F2A1D" stroke-width="5" />
    <path
      d="M512 296 665 512 512 728 359 512 512 296Z"
      fill="none"
      stroke="url(#markGold)"
      stroke-width="22"
      stroke-linejoin="round"
    />
    <path
      d="M429 563c28 36 75 53 121 41 49-13 84-56 86-104"
      fill="none"
      stroke="#FFF4CE"
      stroke-width="26"
      stroke-linecap="round"
    />
    <path
      d="M598 456c-28-30-70-43-112-32-49 13-84 56-86 104"
      fill="none"
      stroke="#9E8D66"
      stroke-width="26"
      stroke-linecap="round"
    />
    <path
      d="M512 386v252M408 512h208"
      stroke="#F8EAC1"
      stroke-width="13"
      stroke-linecap="round"
      opacity="0.74"
    />
    <circle cx="512" cy="512" r="30" fill="#FFF6D7" filter="url(#centerGlow)" />
  </g>
</svg>
